<!doctype html>
<html lang="en">
	<head>
		@input("templates/head.html")
	</head>
	<body>
		<section id="auth-gate" class="auth-gate" aria-labelledby="auth-title"><form id="auth-form"><div class="brand auth-brand"><span>T</span> Trestle</div><p id="auth-kicker" class="eyebrow">Secure administration</p><h1 id="auth-title">Checking setup…</h1><p id="auth-description">Trestle is checking whether this deployment needs its first administrator.</p><fieldset id="database-preview" hidden><legend>Choose a database</legend><label class="database-choice"><input type="radio" name="database-provider" value="sqlite" checked><span><strong>SQLite</strong><small>Embedded in Trestle with no separate database service.</small></span></label><label class="database-choice"><input type="radio" name="database-provider" value="postgres"><span><strong>PostgreSQL</strong><small>Use an existing PostgreSQL 16, 17 or 18 database.</small></span></label><div id="postgres-configuration" hidden><label id="postgres-url">PostgreSQL URL<input name="database-url" type="password" autocomplete="off" placeholder="postgres://user:password@host/trestle?sslmode=require"></label><button id="database-apply" type="button">Test and use PostgreSQL</button></div><p id="database-result" role="status"></p></fieldset><div id="administrator-fields" hidden><label>Email<input id="auth-email" name="email" type="email" autocomplete="username" required></label><label>Password<input id="auth-password" name="password" type="password" minlength="7" autocomplete="current-password" required></label><label id="registration-policy-field">Application registration policy<select id="auth-policy" name="application-registration-policy"><option value="closed">Closed - only administrators can provision accounts</option><option value="approval">Approval - requests require administrator approval</option><option value="invite">Invite - registration requires an invitation</option><option value="open">Open - anyone may register</option></select></label><p id="auth-error" class="auth-error" role="alert"></p><button id="auth-submit" type="submit">Create administrator</button></div></form></section>
		@content
		<script src="/assets/js/script.js?v=__TRESTLE_ASSET_VERSION__" defer></script>
	</body>
</html>
