name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL ${{ matrix.postgres }} suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trestle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trestle_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TRESTLE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/trestle_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  action-pins:
    # Repository-level policy gate. Provisions the scanner's YAML dependency
    # explicitly; the scanner fails closed if it is unavailable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install action-pin scanner dependency
        run: python -m pip install --require-hashes -r .github/workflows/requirements-action-pins.txt
      - name: Action pins
        run: sh scripts/action-pins.sh
      - name: Action pins negative and positive tests
        run: sh scripts/test-action-pins.sh
  gate:
    name: Format, vet, builds and proxy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Frontend checks
        run: |
          node --check internal/web/public/assets/js/script.js
          node scripts/check-web.mjs internal/web/public
          node scripts/test-login-form-contract.mjs
      - name: Cross-build application
        shell: bash
        run: |
          set -eu

          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64
          do
            target_goos=${target%/*}
            target_goarch=${target#*/}

            suffix=
            if [ "$target_goos" = "windows" ]; then
              suffix=.exe
            fi

            GOOS="$target_goos" GOARCH="$target_goarch" \
              go build \
                -o "/tmp/trestle-${target_goos}-${target_goarch}${suffix}" \
                ./cmd/trestle
          done
      - name: Release packaging and installer syntax
        run: |
          sh -n install.sh download.sh update.sh scripts/checksum.sh scripts/package-release.sh scripts/test-release.sh scripts/test-release-reproducible.sh scripts/test-release-contract.sh scripts/test-release-rehearsal.sh scripts/test-installer.sh scripts/test-update.sh scripts/test-download.sh scripts/test-public-scripts.sh scripts/build-public-scripts.sh scripts/test-postgres-gate.sh scripts/test-connection-recovery.sh scripts/test-restore-drill.sh scripts/soak.sh scripts/test-parity-gate.sh scripts/test-subsystem-gate.sh
          ./scripts/test-installer.sh
          ./scripts/test-update.sh
          ./scripts/test-download.sh
          ./scripts/test-public-scripts.sh
          ./scripts/test-release.sh
          ./scripts/test-release-contract.sh
          ./scripts/test-release-reproducible.sh
          ./scripts/test-release-rehearsal.sh
      - name: Real Caddy and nginx TLS smoke tests
        run: ./scripts/test-proxies.sh
  systemd-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the binary under test
        run: CGO_ENABLED=0 go build -o /tmp/tr ./cmd/trestle
      - name: Rehearse the systemd lifecycle (install -> health -> update -> rollback -> uninstall)
        run: |
          set -euxo pipefail
          DATA=/var/lib/trestle
          wait_health() {
            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:7333/system/health >/dev/null 2>&1; then
                return 0
              fi
              sleep 0.5
            done
            echo "health never became ready" >&2
            return 1
          }
          sudo /tmp/tr service install
          # account and data ownership are created by install
          id trestle
          test "$(stat -c %U "$DATA")" = trestle || exit 1
          systemctl is-active trestle.service
          wait_health
          # install is idempotent (byte-identical + enabled + active -> no-op)
          sudo /tmp/tr service install
          wait_health
          # status is read-only, no sudo
          /tmp/tr service status | grep -E 'health:  ok'
          # start/stop/restart/enable/disable family
          sudo /tmp/tr service stop
          sudo /tmp/tr service stop   # repeated stop is safe
          sudo /tmp/tr service start
          wait_health
          sudo /tmp/tr service restart
          wait_health
          sudo /tmp/tr service disable
          sudo /tmp/tr service disable   # repeated disable is safe
          test "$(systemctl is-enabled trestle.service)" = disabled
          sudo /tmp/tr service enable
          test "$(systemctl is-enabled trestle.service)" = enabled
          # boot-enablement is asserted structurally (not a reboot claim)
          grep -q 'WantedBy=multi-user.target' /etc/systemd/system/trestle.service
          grep -q '^StartLimitIntervalSec=60$' /etc/systemd/system/trestle.service
          grep -q '^StartLimitBurst=5$' /etc/systemd/system/trestle.service
          grep -q '^Restart=on-failure$' /etc/systemd/system/trestle.service
          grep -q '^RestartSec=3$' /etc/systemd/system/trestle.service
          # update with a verified artifact
          CGO_ENABLED=0 go build -o /tmp/tr2 ./cmd/trestle
          SHA=$(sha256sum /tmp/tr2 | cut -d' ' -f1)
          sudo /tmp/tr service update /tmp/tr2 "$SHA"
          wait_health
          # rollback restores the previous executable
          sudo /tmp/tr service rollback
          wait_health
          # a deliberately stopped service stays stopped across update and rollback
          sudo /tmp/tr service stop
          CGO_ENABLED=0 go build -o /tmp/tr4 ./cmd/trestle
          SHA4=$(sha256sum /tmp/tr4 | cut -d' ' -f1)
          sudo /tmp/tr service update /tmp/tr4 "$SHA4"
          test "$(systemctl is-active trestle.service)" = inactive
          sudo /tmp/tr service rollback
          test "$(systemctl is-active trestle.service)" = inactive
          # stop -> uninstall removes the unit; data is preserved
          sudo /tmp/tr service stop
          sudo /tmp/tr service uninstall
          test ! -f /etc/systemd/system/trestle.service
          sudo test -d "$DATA"
      - name: Rehearse partial-failure rollback (deterministic activation failure)
        run: |
          set -euxo pipefail
          wait_health() {
            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:7333/system/health >/dev/null 2>&1; then
                return 0
              fi
              sleep 0.5
            done
            return 1
          }
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/systemctl <<'EOF'
          #!/bin/sh
          case "$*" in
            *"restart trestle.service"*) echo "simulated activation failure" >&2; exit 1 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x /tmp/fakebin/systemctl
          set +e
          sudo env "PATH=/tmp/fakebin:/usr/sbin:/usr/bin:/bin" /tmp/tr service install > /tmp/install-fail.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "install with failing activation succeeded unexpectedly" >&2; exit 1; }
          grep -q "rolled back" /tmp/install-fail.log || { echo "install did not report rollback" >&2; cat /tmp/install-fail.log >&2; exit 1; }
          test ! -f /etc/systemd/system/trestle.service || { echo "unit left behind after rollback" >&2; exit 1; }
          sudo test -d /var/lib/trestle
          # Installation can then be repeated successfully.
          sudo /tmp/tr service install
          wait_health
          sudo /tmp/tr service uninstall || true
          # Second branch: no pre-existing binary.
          sudo rm -f /usr/local/bin/trestle
          set +e
          sudo env "PATH=/tmp/fakebin:/usr/sbin:/usr/bin:/bin" /tmp/tr service install > /tmp/install-fail2.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "no-binary install with failing activation succeeded unexpectedly" >&2; exit 1; }
          grep -q "rolled back" /tmp/install-fail2.log || { echo "no-binary install did not report rollback" >&2; exit 1; }
          test ! -f /etc/systemd/system/trestle.service || { echo "unit left behind after no-binary rollback" >&2; exit 1; }
          test ! -f /usr/local/bin/trestle || { echo "newly copied binary not removed after no-binary rollback" >&2; exit 1; }
          sudo test -d /var/lib/trestle
          # A normal install then succeeds again.
          sudo /tmp/tr service install
          wait_health
          sudo /tmp/tr service uninstall || true
