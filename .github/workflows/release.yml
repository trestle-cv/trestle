name: Release

on:
  push:
    tags: ['v*']

# Privilege is minimized: the build job runs read-only; the attestation job
# holds exactly the provenance permission contract (contents: read,
# id-token: write, attestations: write); and only the publication job holds
# contents: write. Every action is pinned to a reviewed full commit SHA (with
# the human-readable version in a trailing comment); the release-contract
# regression (scripts/test-release-contract.sh) rejects any mutable tag here.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          node --check internal/web/public/assets/js/script.js
          node scripts/check-web.mjs internal/web/public
          node scripts/test-database-setup.mjs
          node scripts/test-login-form-contract.mjs
      - name: Package six targets
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Write release notes
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME#v}" in
            *-*)
              kind="preview release candidate"
              body="is a preview / release candidate, not a stable release. Use it to test an upcoming release; prereleases must be selected explicitly by version."
              ;;
            *)
              kind="stable public preview"
              body="establishes the stable download channel and the initial public compatibility contract. It is ready for public preview and evaluation, but is not yet claimed to be production-proven or battle-proven."
              ;;
          esac
          sed -e "s|{{VERSION}}|${GITHUB_REF_NAME#v}|" \
              -e "s|{{RELEASE_KIND}}|${kind}|" \
              -e "s|{{RELEASE_KIND_BODY}}|${body}|" \
              docs/release-notes-template.md > release-body.md
      - name: Validate release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ -s release-body.md ] || { echo "release body is empty" >&2; exit 1; }
          grep -q "{{VERSION}}\|{{RELEASE_KIND}}\|{{RELEASE_KIND_BODY}}" release-body.md \
            && { echo "unresolved placeholder in the release body" >&2; exit 1; } || true
          echo "$version" | grep -q . && grep -q "$version" release-body.md \
            || { echo "expected version missing from the release body" >&2; exit 1; }
          case "$version" in
            *-*)
              grep -qi "preview / release candidate" release-body.md || { echo "prerelease body lacks release-candidate wording" >&2; exit 1; }
              grep -qi "not a stable release" release-body.md || { echo "prerelease body must say it is not a stable release" >&2; exit 1; }
              ;;
            *)
              grep -qi "stable public preview" release-body.md || { echo "stable body lacks stable-public-preview wording" >&2; exit 1; }
              grep -qi "release candidate" release-body.md && { echo "stable body must not call itself a release candidate" >&2; exit 1; } || true
              grep -qi "not a stable release" release-body.md && { echo "stable body must not say it is not a stable release" >&2; exit 1; } || true
              ;;
          esac
          for heading in "Supported database options" "Operator responsibilities" "Back up before upgrading" "Known limitations" "Verified installation"; do
            grep -qi "$heading" release-body.md || { echo "release body lacks: $heading" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/*
            release-body.md

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

  publish:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: .
      - id: prerelease
        run: |
          # A semver prerelease suffix (the part after the first '-') publishes
          # a GitHub prerelease, so /releases/latest never selects it. Build
          # metadata ('+...') is not a prerelease.
          case "${GITHUB_REF_NAME#v}" in
            *-*) echo "is-prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "is-prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-body.md
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is-prerelease }}
